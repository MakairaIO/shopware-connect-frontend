services:
  shopware:
    # Primary target for 6.7 compatibility work. Override for regression:
    #   docker compose -f docker-compose.yml -f docker-compose.6.6.yml up -d
    #   docker compose -f docker-compose.yml -f docker-compose.6.5.yml up -d
    image: dockware/dev:6.7.2.2
    container_name: shopware
    volumes:
      - "./:/var/www/html/custom/plugins/MakairaConnectFrontend"
      - "/var/www/html/custom/plugins"
      - "db_volume:/var/lib/mysql"
      - "shop_volume:/var/www/html"
    ports:
      - "80:80"
      - "3306:3306"
      - "8888:8888"
      - "9999:9999"
      - "9998:9998"
    networks:
      - web
    environment:
      - XDEBUG_ENABLED=1

volumes:
  db_volume:
    driver: local
  shop_volume:
    driver: local

networks:
  web:
